<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 340 260"
     fill="none"
     role="img"
     aria-label="Soft lavender and blue brain illustration">

  <defs>
    <linearGradient id="brainGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D9C8FF"/>
      <stop offset="50%" stop-color="#ADA6F3"/>
      <stop offset="100%" stop-color="#83BDF5"/>
    </linearGradient>

    <linearGradient id="rightGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E4D9FF"/>
      <stop offset="100%" stop-color="#8ABCF3"/>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dy="6"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.17"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="170" cy="124" r="104" fill="#AFA4F5" opacity=".10"/>

  <g filter="url(#softShadow)"
